[workspace]
resolver = "2"
members = [
    "crates/dh-win32",
    "crates/dh-gadget-injector",
    "crates/dh-server-tool",
    "crates/dh-client-eos-fix",
    "crates/dh-client-voice",
]

[workspace.package]
license-file = "LICENSE"
repository = "https://github.com/AsaNeonSama/DH_ServerTool_JA"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
