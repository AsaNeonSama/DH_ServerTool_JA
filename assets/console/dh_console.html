<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DH-Web-Console</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Dela+Gothic+One&family=JetBrains+Mono:wght@700;800&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-display: "Chakra Petch", "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Kaku Gothic StdN", "Yu Gothic", "Meiryo", sans-serif;
        --font-ui: "Chakra Petch", "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        --font-tech: "Chakra Petch", "JetBrains Mono", "Zen Kaku Gothic New", "Cascadia Mono", "Consolas", monospace;
        --font-mono: "JetBrains Mono", "Chakra Petch", "Zen Kaku Gothic New", "Cascadia Mono", "Consolas", monospace;
        --ink: #0b0b10;
        --ink-soft: #1a1a24;
        --paper: #f6f4ea;
        --surface: #fffef8;
        --card: #ffffff;
        --blue: #1e6bff;
        --cyan: #00e5ff;
        --green: #00ff87;
        --lime: #c8ff00;
        --yellow: #ffe600;
        --pink: #ff2a85;
        --magenta: #ff00aa;
        --red: #ff2a55;
        --neon-strip: linear-gradient(
          110deg,
          #00e5ff 0%,
          #1e6bff 20%,
          #00ff87 40%,
          #ffe600 60%,
          #ff2a55 80%,
          #ff00aa 100%
        );
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        font-family: var(--font-ui);
        font-feature-settings: "palt" 1;
        background-color: var(--paper);
        background-image:
          linear-gradient(128deg, rgba(30, 107, 255, 0.08) 0, rgba(30, 107, 255, 0.08) 14%, transparent 14%),
          linear-gradient(-32deg, rgba(255, 42, 133, 0.09) 0, rgba(255, 42, 133, 0.09) 13%, transparent 13%),
          linear-gradient(to right, rgba(11, 11, 16, 0.055) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(11, 11, 16, 0.055) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 26px 26px, 26px 26px;
        margin: 0;
        padding: max(28px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(52px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        font-weight: 700;
        line-height: 1.55;
        color: var(--ink);
        overflow-x: hidden;
        position: relative;
        touch-action: manipulation;
      }

      /* Irregular angular geometric background shards */
      .geo-backdrop {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .geo-shard {
        position: absolute;
        pointer-events: none;
      }

      .geo-shard-1 {
        top: 4%;
        left: 3%;
        width: 140px;
        height: 130px;
        background: var(--yellow);
        clip-path: polygon(0 0, 100% 14%, 26% 100%);
        filter: drop-shadow(6px 6px 0 var(--ink));
      }

      .geo-shard-2 {
        top: 10%;
        right: 3%;
        width: 165px;
        height: 78px;
        background: var(--pink);
        clip-path: polygon(16% 0, 100% 0, 84% 100%, 0 100%);
        filter: drop-shadow(6px 6px 0 var(--ink));
      }

      .geo-shard-3 {
        bottom: 9%;
        left: 2.5%;
        width: 120px;
        height: 120px;
        background: var(--cyan);
        clip-path: polygon(50% 0, 100% 34%, 78% 100%, 8% 82%, 0 28%);
        filter: drop-shadow(6px 6px 0 var(--ink));
      }

      .geo-shard-4 {
        bottom: 6%;
        right: 3.5%;
        width: 150px;
        height: 105px;
        background: var(--lime);
        clip-path: polygon(18% 0, 100% 24%, 82% 100%, 0 76%);
        filter: drop-shadow(6px 6px 0 var(--ink));
      }

      .geo-shard-5 {
        top: 46%;
        left: 1.2%;
        width: 54px;
        height: 110px;
        background: repeating-linear-gradient(
          -45deg,
          var(--ink) 0,
          var(--ink) 8px,
          var(--yellow) 8px,
          var(--yellow) 16px
        );
        clip-path: polygon(0 12%, 100% 0, 100% 88%, 0 100%);
        filter: drop-shadow(4px 4px 0 var(--ink));
      }

      .geo-shard-6 {
        top: 52%;
        right: 1.5%;
        width: 64px;
        height: 64px;
        background: var(--blue);
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        filter: drop-shadow(5px 5px 0 var(--ink));
      }

      /* Outer angular shell providing crisp polygon silhouette + true offset drop shadows */
      .shell-frame {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 880px;
        filter: drop-shadow(10px 10px 0 var(--ink)) drop-shadow(5px 5px 0 var(--pink));
      }

      .shell-border {
        background: var(--ink);
        padding: 4px;
        clip-path: polygon(
          0 0,
          calc(100% - 30px) 0,
          100% 30px,
          100% 100%,
          26px 100%,
          0 calc(100% - 26px)
        );
      }

      #wrapper {
        width: 100%;
        background-color: var(--card);
        clip-path: polygon(
          0 0,
          calc(100% - 27px) 0,
          100% 27px,
          100% 100%,
          23px 100%,
          0 calc(100% - 23px)
        );
        position: relative;
      }

      .neon-ribbon {
        height: 13px;
        width: 100%;
        background: var(--neon-strip);
        background-size: 200% 100%;
        animation: neonFlow 6s linear infinite;
        border-bottom: 4px solid var(--ink);
      }

      @keyframes neonFlow {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }

      .console-header {
        background:
          linear-gradient(
            114deg,
            var(--blue) 0%,
            var(--blue) 63%,
            var(--ink) 63%,
            var(--ink) 64.4%,
            #132248 64.4%,
            #132248 100%
          );
        color: #ffffff;
        padding: 22px 28px;
        border-bottom: 4px solid var(--ink);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        position: relative;
      }

      .console-brand {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
      }

      .brand-emblem-wrap {
        flex-shrink: 0;
        filter: drop-shadow(4px 4px 0 var(--ink));
      }

      .brand-emblem {
        width: 58px;
        height: 58px;
        background: var(--ink);
        padding: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      }

      .brand-emblem-inner {
        width: 100%;
        height: 100%;
        background: var(--yellow);
        display: flex;
        align-items: center;
        justify-content: center;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      }

      .brand-emblem-inner img {
        width: 34px;
        height: 34px;
        display: block;
      }

      .console-title-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      .console-kicker {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        background-color: var(--ink);
        color: var(--cyan);
        padding: 4px 14px;
        display: inline-block;
        width: fit-content;
        clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      }

      .console-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 27px;
        font-weight: 900;
        font-synthesis-weight: none;
        letter-spacing: 0.05em;
        line-height: 1.18;
        text-shadow: 3px 3px 0 var(--ink), 5px 5px 0 rgba(11, 11, 16, 0.35);
      }

      .console-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .badge-wrap {
        filter: drop-shadow(4px 4px 0 var(--ink));
      }

      .badge {
        display: inline-block;
        font-family: var(--font-tech);
        font-style: italic;
        font-size: 12.5px;
        font-weight: 700;
        padding: 6px 16px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        clip-path: polygon(9px 0, 100% 0, calc(100% - 9px) 100%, 0 100%);
      }

      .badge-yellow {
        background-color: var(--yellow);
        color: var(--ink);
      }

      .badge-pink {
        background-color: var(--pink);
        color: #ffffff;
      }

      .console-body {
        padding: 26px 28px 30px;
      }

      .section-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .section-tag-wrap {
        filter: drop-shadow(4px 4px 0 var(--cyan));
      }

      .section-tag {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-family: var(--font-ui);
        font-size: 13.5px;
        font-weight: 900;
        letter-spacing: 0.1em;
        background-color: var(--ink);
        color: var(--yellow);
        padding: 6px 19px 6px 14px;
        clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 100%, 0 100%);
      }

      .section-tag::before {
        content: "";
        display: inline-block;
        width: 11px;
        height: 11px;
        background: var(--neon-strip);
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      }

      .section-accent-line {
        flex: 1;
        height: 10px;
        background: repeating-linear-gradient(
          -55deg,
          var(--ink) 0,
          var(--ink) 6px,
          transparent 6px,
          transparent 14px
        );
        opacity: 0.25;
      }

      /* Operation selector tiles - irregular chamfered polygons with crisp ink borders */
      #op {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 26px;
      }

      .op-tile {
        position: relative;
        filter: drop-shadow(5px 5px 0 var(--ink));
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      .op-tile input[type="radio"] {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        pointer-events: none;
      }

      #op label {
        display: block;
        background-color: var(--ink);
        padding: 3.5px;
        cursor: pointer;
        user-select: none;
        clip-path: polygon(
          0 0,
          calc(100% - 15px) 0,
          100% 15px,
          100% 100%,
          12px 100%,
          0 calc(100% - 12px)
        );
      }

      #op .op-face {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 52px;
        padding: 12px 15px;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.03em;
        clip-path: polygon(
          0 0,
          calc(100% - 12px) 0,
          100% 12px,
          100% 100%,
          9px 100%,
          0 calc(100% - 9px)
        );
        transition: filter 0.12s ease;
      }

      #op .op-diamond {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        background-color: var(--ink);
        padding: 3px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      }

      #op .op-diamond::after {
        content: "";
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        transition: background 0.14s ease, transform 0.14s ease;
      }

      .op-tile:nth-child(1) .op-face {
        background-color: var(--blue);
        color: #ffffff;
      }

      .op-tile:nth-child(2) .op-face {
        background-color: var(--yellow);
        color: var(--ink);
      }

      .op-tile:nth-child(3) .op-face {
        background-color: var(--pink);
        color: #ffffff;
      }

      .op-tile:nth-child(4) .op-face {
        background-color: var(--cyan);
        color: var(--ink);
      }

      .op-tile:nth-child(5) .op-face {
        background-color: var(--lime);
        color: var(--ink);
      }

      .op-tile:nth-child(6) .op-face {
        background-color: var(--red);
        color: #ffffff;
      }

      .op-tile:hover {
        transform: translate(-2px, -2px);
        filter: drop-shadow(7px 7px 0 var(--ink));
      }

      .op-tile:has(input[type="radio"]:checked) {
        transform: translate(2px, 2px);
        filter:
          drop-shadow(3px 3px 0 var(--ink))
          drop-shadow(-3px -3px 0 var(--yellow))
          drop-shadow(4px 4px 0 var(--pink));
      }

      .op-tile input[type="radio"]:checked + label .op-diamond::after {
        background: var(--neon-strip);
        transform: scale(1.1);
      }

      .op-tile input[type="radio"]:focus-visible + label {
        outline: 3px dashed var(--ink);
        outline-offset: 4px;
      }

      .idle-hint {
        display: none;
      }

      /* Form container - angular cut-corner card */
      #form {
        margin-bottom: 24px;
        filter: drop-shadow(7px 7px 0 var(--blue));
      }

      .form-border {
        background: var(--ink);
        padding: 3.5px;
        clip-path: polygon(
          18px 0,
          100% 0,
          100% calc(100% - 20px),
          calc(100% - 20px) 100%,
          0 100%,
          0 18px
        );
      }

      #baseForm {
        background-color: var(--surface);
        padding: 24px 26px 28px;
        position: relative;
        clip-path: polygon(
          15px 0,
          100% 0,
          100% calc(100% - 17px),
          calc(100% - 17px) 100%,
          0 100%,
          0 15px
        );
      }

      #baseForm::before {
        content: "";
        display: block;
        height: 8px;
        margin: -24px -26px 22px;
        background: var(--neon-strip);
        border-bottom: 3.5px solid var(--ink);
      }

      #baseForm label {
        display: inline-block;
        margin-top: 20px;
        margin-bottom: 9px;
        padding: 4px 16px 4px 14px;
        font-weight: 900;
        color: var(--ink);
        background-color: var(--yellow);
        font-size: 13.5px;
        letter-spacing: 0.05em;
        clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
        filter: drop-shadow(3px 3px 0 var(--ink));
      }

      #baseForm label:first-of-type {
        margin-top: 0;
      }

      /* Keep native select directly in #baseForm for verbatim script compatibility, visually replaced by .nb-select */
      #baseForm select.native-select-hidden {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* Fallback style if JS enhancer ever hasn't run yet (clean, NO weird cyan block) */
      #baseForm select:not(.native-select-hidden),
      #baseForm input {
        display: block;
        width: 100%;
        min-height: 50px;
        padding: 12px 16px;
        border: 3px solid var(--ink);
        border-radius: 0;
        font-size: 15.5px;
        font-weight: 700;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        color: var(--ink);
        background-color: #ffffff;
        box-shadow: 4px 4px 0 var(--ink);
        transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
        outline: none;
      }

      #baseForm input:focus {
        background-color: #f3fbff;
        box-shadow: 6px 6px 0 var(--pink);
        transform: translate(-1px, -1px);
      }

      /* Custom Angular Neo-Brutalist Dropdown Trigger (clean, crisp, zero meaningless blue block) */
      .nb-select {
        position: relative;
        width: 100%;
        filter: drop-shadow(4px 4px 0 var(--ink));
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      .nb-select:hover,
      .nb-select.is-open {
        transform: translate(-1px, -1px);
        filter: drop-shadow(6px 6px 0 var(--pink));
      }

      .nb-select-shell {
        background: var(--ink);
        padding: 3px;
        clip-path: polygon(
          0 0,
          calc(100% - 14px) 0,
          100% 14px,
          100% 100%,
          10px 100%,
          0 calc(100% - 10px)
        );
      }

      .nb-select-trigger {
        width: 100%;
        min-height: 48px;
        padding: 10px 12px 10px 16px;
        border: 0;
        background-color: #ffffff;
        color: var(--ink);
        font-family: var(--font-ui);
        font-variant-numeric: tabular-nums;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.025em;
        text-align: left;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        outline: none;
        clip-path: polygon(
          0 0,
          calc(100% - 11px) 0,
          100% 11px,
          100% 100%,
          8px 100%,
          0 calc(100% - 8px)
        );
        transition: background-color 0.12s ease;
      }

      .nb-select.is-open .nb-select-trigger,
      .nb-select-trigger:focus-visible {
        background-color: #fffde2;
      }

      .nb-select-value {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nb-select-chevron {
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        background-color: var(--ink);
        color: var(--yellow);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        transition: background-color 0.14s ease, color 0.14s ease;
      }

      .nb-select.is-open .nb-select-chevron {
        background-color: var(--pink);
        color: #ffffff;
      }

      .nb-select-chevron svg {
        width: 14px;
        height: 14px;
        display: block;
        transition: transform 0.16s ease;
      }

      .nb-select.is-open .nb-select-chevron svg {
        transform: rotate(180deg);
      }

      /* Portal Backdrop (Mobile bottom sheet) */
      .nb-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(11, 11, 16, 0.56);
        z-index: 1990;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.16s ease;
      }

      .nb-backdrop.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      /* Portal Dropdown Menu */
      .nb-portal-wrap {
        position: fixed;
        z-index: 2000;
        display: none;
        filter: drop-shadow(7px 7px 0 var(--ink)) drop-shadow(4px 4px 0 var(--cyan));
      }

      .nb-portal-wrap.is-open {
        display: block;
        animation: menuSnap 0.14s cubic-bezier(0.2, 0.9, 0.3, 1);
      }

      @keyframes menuSnap {
        0% { opacity: 0; transform: translateY(-6px) scaleY(0.96); }
        100% { opacity: 1; transform: translateY(0) scaleY(1); }
      }

      .nb-portal-border {
        background: var(--ink);
        padding: 3.5px;
        clip-path: polygon(
          0 0,
          100% 0,
          100% calc(100% - 16px),
          calc(100% - 16px) 100%,
          0 100%
        );
      }

      .nb-portal-menu {
        background: #ffffff;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        clip-path: polygon(
          0 0,
          100% 0,
          100% calc(100% - 13px),
          calc(100% - 13px) 100%,
          0 100%
        );
      }

      .nb-portal-header {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        background: var(--ink);
        color: var(--yellow);
        border-bottom: 3px solid var(--ink);
        font-family: var(--font-ui);
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }

      .nb-portal-close {
        width: 34px;
        height: 34px;
        border: 0;
        background: var(--pink);
        color: #ffffff;
        font-size: 18px;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
      }

      .nb-portal-list {
        list-style: none;
        margin: 0;
        padding: 6px;
        overflow-y: auto;
        overscroll-behavior: contain;
        max-height: 290px;
      }

      .nb-portal-list::-webkit-scrollbar {
        width: 10px;
      }

      .nb-portal-list::-webkit-scrollbar-track {
        background: #eceae0;
        border-left: 2px solid var(--ink);
      }

      .nb-portal-list::-webkit-scrollbar-thumb {
        background: var(--ink);
      }

      .nb-portal-option {
        padding: 10px 14px;
        font-size: 15px;
        font-weight: 800;
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
        border: 2px solid transparent;

      // 发信按钮监听方法

      async function btnDisplaySwitch() {
        btn.textContent === btnTextContent.pending ? 
        btn.textContent = btnTextContent.beforeClick : 
        btn.textContent = btnTextContent.pending;
        btn.disabled = !btn.disabled;
      };
      // 消息提示
      function showMessage(message, type = 'success') {
        const toastTemplate = (type === 'error') ? document.getElementById('error-toast-template') : document.getElementById('success-toast-template');
        const toastContainer = document.querySelector('.toast-container') || document.createElement('div');
        if (!toastContainer.classList.contains('toast-container')) {
          toastContainer.className = 'toast-container';
          document.body.appendChild(toastContainer);
        }
        const toast = toastTemplate.content.firstElementChild.cloneNode(true);
        toast.querySelector('.message').textContent = message;
        const closeBtn = toast.querySelector('.close-btn');
        closeBtn.addEventListener('click', () => {
          toast.style.opacity = '0';
          setTimeout(() => {
            toastContainer.removeChild(toast);
          }, 300);
        });
        toast.style.animation = 'fadeIn 0.5s ease-out';
        setTimeout(() => {
          toast.style.animation = 'fadeOut 0.5s ease-in forwards';
          setTimeout(() => {
            toastContainer.removeChild(toast);
          }, 500);
        }, 3000);
        toastContainer.appendChild(toast);
      };

      // 映射最终的请求体
      async function getRequestBody() {
        let requestBody;
        switch (fetchUrl) {
          case "/dh-console/console_command":
            const optionType = document.getElementById("consoleOrder").value;
            requestBody =  JSON.stringify({
                player_name: document.getElementById("playerName").value,
                command: `${consoleCommandMap[optionType]} ${document.getElementById(optionType).value}`,
              });
            return requestBody;
          case "/dh-console/set_human":
            requestBody = JSON.stringify({
              player_name: document.getElementById("playerName").value,
              prop_name: document.getElementById("statusOrder").value,
              value: document.getElementById("statusOrderOption").value,
            });
            return requestBody;
          case "/dh-console/add_item":
            requestBody = JSON.stringify({
              player_name: document.getElementById("playerName").value,
              item_name: document.getElementById("itemOrder").value,
              count: document.getElementById("itemNum").value,
            });
            return requestBody;
          case "/dh-console/set_storage":
            requestBody = JSON.stringify({
              player_name: document.getElementById("playerName").value,
              limit: document.getElementById("inventoryOrder").value,
            });
            return requestBody;
          case "/dh-console/send_thrall_msg":
            requestBody = JSON.stringify({
              player_name: document.getElementById("playerName").value,
              msg: document.getElementById("chatOrder").value,
            });
            return requestBody;
          case "/dh-console/send_thrall_msg/broadcast":
            requestBody = JSON.stringify({
              msg: document.getElementById("chatOrder").value,
            });
            return requestBody;
          case "/dh-console/set_storage_limit":
          case "/dh-console/kick_player":
            requestBody = JSON.stringify({
              player_name: document.getElementById("playerName").value,
            });
            return requestBody;
          default:
            return null;
        };
      };

      btn.onclick = async function(event) {
        let responseBody = undefined;
        const requestBody = await getRequestBody();

        // console.log(fetchUrl,requestBody)
        setTimeout(async function() {
          if (responseBody === undefined) {
            showMessage(errorMessage, "error");
            setTimeout (btnDisplaySwitch, 175);
          } 
        }, 3000);

        await btnDisplaySwitch();
        try {
          responseBody = await fetch(
              fetchUrl,
              {
                method: "POST",
                credentials: "include",
                headers: {
                  "Content-Type": "application/json",
                },
                body: requestBody,
              }
          ).then(responseBody => responseBody.json());
        }
        catch {
          responseBody = undefined;
        }

        if (responseBody !== undefined) {
          if (responseBody.status !== 200) {
            showMessage(responseBody.msg, "error");
          } else {
            showMessage(responseBody.msg, "success");
          }
          setTimeout (btnDisplaySwitch, 175);
        }
      };

      function switchHumanChild(statusOrder) {

      // add_storage 表单一级条件元素 add
      function addSetStorageChild() {

        inventoryOrderLabel.textContent = "ストレージ設定: ";

        const inventoryOrderSelect = document.createElement("select");

        inventoryOrderSelect.required = true;
        for (let i = 0; i < storageSetList.length; i++) {

      // chat 表单一级元素 add
      function addChatChild() {

        const chatBroadcastSelect = document.createElement("select");

        chatBroadcastSelect.id = "chatBroadcast";
        chatBroadcastSelect.required = true;

        const chatBroadcastOptionY = document.createElement("option");
        chatBroadcastOptionY.textContent = "オン";
        chatBroadcastOptionY.value = "1";
        const chatBroadcastOptionN = document.createElement("option");
        chatBroadcastOptionN.textContent = "オフ";
        chatBroadcastOptionN.value = "0";

        chatBroadcastSelect.appendChild(chatBroadcastOptionY);
        chatBroadcastSelect.appendChild(chatBroadcastOptionN);

        const chatLabel = document.createElement("label");
        chatLabel.htmlFor = "chatOrder";

      radioGroup.forEach(radio => {

          if (event.target.checked) {

          if (baseForm.style.display = "none") {
            baseForm.style.display = "block";

          {

          switch (currentOption) {

              break;

              removeOtherChild("chatOrder", firstLevelChildList);

              broadcastSelect.onchange = function(event) {
                if (event.target.value == "1") {
                  fetchUrl = `/${baseUrl}/${currentOption}/broadcast`;
                } else {
                  fetchUrl = `/${baseUrl}/${currentOption}`;
                }
              }
              fetchUrl = `/${baseUrl}/${currentOption}/broadcast`;
              //console.log(fetchUrl);
              break;
            case "kick_player":
              removeOtherChild(" ", firstLevelChildList);
              removeOtherChild(" ", secondLevelChildList);
              fetchUrl = `/${baseUrl}/${currentOption}`;

  </script>
  <script>
    (function () {
      const baseForm = document.getElementById("baseForm");
      if (!baseForm) return;

      const MOBILE_BP = 640;
      const widgetMap = new WeakMap();
      let activeSelect = null;
      let activeIndex = -1;
      let prevBodyOverflow = "";

      // Create shared backdrop & portal dropdown mounted on document.body
      // so ancestor clip-path never clips the open menu.
      const backdrop = document.createElement("div");
      backdrop.className = "nb-backdrop";
      backdrop.setAttribute("aria-hidden", "true");

      const portalWrap = document.createElement("div");
      portalWrap.className = "nb-portal-wrap";
      portalWrap.setAttribute("role", "dialog");
      portalWrap.setAttribute("aria-modal", "false");

      const portalBorder = document.createElement("div");
      portalBorder.className = "nb-portal-border";

      const portalMenu = document.createElement("div");
      portalMenu.className = "nb-portal-menu";

      const portalHeader = document.createElement("div");
      portalHeader.className = "nb-portal-header";

      const portalTitle = document.createElement("span");
      portalTitle.className = "nb-portal-title";

      const portalClose = document.createElement("button");
      portalClose.type = "button";
      portalClose.className = "nb-portal-close";
      portalClose.setAttribute("aria-label", "閉じる");
      portalClose.textContent = "×";

      portalHeader.appendChild(portalTitle);
      portalHeader.appendChild(portalClose);

      const portalList = document.createElement("ul");
      portalList.className = "nb-portal-list";
      portalList.setAttribute("role", "listbox");

      portalMenu.appendChild(portalHeader);
      portalMenu.appendChild(portalList);
      portalBorder.appendChild(portalMenu);
      portalWrap.appendChild(portalBorder);

      document.body.appendChild(backdrop);
      document.body.appendChild(portalWrap);

      function isMobileViewport() {
        return window.innerWidth <= MOBILE_BP;
      }

      function getLabelForSelect(select) {
        if (select.id) {
          const lbl = baseForm.querySelector(`label[for="${CSS.escape(select.id)}"]`);
          if (lbl && lbl.textContent) {
            return lbl.textContent.replace(/[:：\s]+$/g, "").trim();
          }
        }
        return "項目を選択";
      }

      function getSelectedText(select) {
        const idx = select.selectedIndex;
        if (idx >= 0 && select.options[idx]) {
          return select.options[idx].textContent || "";
        }
        return select.options[0] ? select.options[0].textContent || "" : "";
      }

      function updateTriggerText(select) {
        const entry = widgetMap.get(select);
        if (!entry) return;
        entry.valueEl.textContent = getSelectedText(select);
        entry.trigger.disabled = select.disabled;
      }

      function buildSelectWidget(select) {
        if (widgetMap.has(select)) {
          const existing = widgetMap.get(select);
          if (existing.root.parentNode !== baseForm || existing.root.previousElementSibling !== select) {
            select.insertAdjacentElement("afterend", existing.root);
          }
          updateTriggerText(select);
          return existing;
        }

        select.classList.add("native-select-hidden");
        select.setAttribute("tabindex", "-1");
        select.setAttribute("aria-hidden", "true");

        const root = document.createElement("div");
        root.className = "nb-select";
        root.dataset.nbFor = select.id || select.name || "";

        const shell = document.createElement("div");
        shell.className = "nb-select-shell";

        const trigger = document.createElement("button");
        trigger.type = "button";
        trigger.className = "nb-select-trigger";
        trigger.setAttribute("aria-haspopup", "listbox");
        trigger.setAttribute("aria-expanded", "false");

        const valueEl = document.createElement("span");
        valueEl.className = "nb-select-value";

        const chevron = document.createElement("span");
        chevron.className = "nb-select-chevron";
        chevron.setAttribute("aria-hidden", "true");
        chevron.innerHTML =
          '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M2.5 5.25L8 11.25L13.5 5.25" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"/>' +
          "</svg>";

        trigger.appendChild(valueEl);
        trigger.appendChild(chevron);
        shell.appendChild(trigger);
        root.appendChild(shell);

        const entry = { root, trigger, valueEl, select };
        widgetMap.set(select, entry);
        select.insertAdjacentElement("afterend", root);
        updateTriggerText(select);

        trigger.addEventListener("click", function (event) {
          event.preventDefault();
          event.stopPropagation();
          if (activeSelect === select) {
            closePortal(false);
          } else {
            openPortal(select);
          }
        });

        trigger.addEventListener("keydown", function (event) {
          if (event.key === "ArrowDown" || event.key === "ArrowUp" || event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            event.stopPropagation();
            if (activeSelect !== select) {
              openPortal(select);
            } else if (event.key === "ArrowDown") {
              moveActive(1);
            } else if (event.key === "ArrowUp") {
              moveActive(-1);
            } else {
              commitActive();
            }
          } else if (event.key === "Escape" && activeSelect === select) {
            event.preventDefault();
            event.stopPropagation();
            closePortal(true);
          }
        });

        select.addEventListener("change", function () {
          updateTriggerText(select);
        });

        return entry;
      }

      function setActiveOption(index) {
        const items = portalList.querySelectorAll(".nb-portal-option");
        if (items.length === 0) {
          activeIndex = -1;
          return;
        }
        const clamped = Math.max(0, Math.min(items.length - 1, index));
        activeIndex = clamped;
        items.forEach(function (item, i) {
          if (i === clamped) {
            item.classList.add("is-active");
            item.scrollIntoView({ block: "nearest" });
          } else {
            item.classList.remove("is-active");
          }
        });
      }

      function moveActive(delta) {
        const items = portalList.querySelectorAll(".nb-portal-option");
        if (items.length === 0) return;
        const next = activeIndex < 0 ? 0 : (activeIndex + delta + items.length) % items.length;
        setActiveOption(next);
      }

      function commitIndex(index) {
        if (!activeSelect) return;
        const target = activeSelect;
        if (index >= 0 && index < target.options.length) {
          const changed = target.selectedIndex !== index;
          target.selectedIndex = index;
          updateTriggerText(target);
          closePortal(true);
          if (changed) {
            target.dispatchEvent(new Event("change", { bubbles: true }));
          }
        } else {
          closePortal(true);
        }
      }

      function commitActive() {
        if (activeIndex >= 0) {
          commitIndex(activeIndex);
        } else {
          closePortal(true);
        }
      }

      function positionDesktopPortal(entry) {
        const rect = entry.trigger.getBoundingClientRect();
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const margin = 10;
        const gap = 6;
        const width = Math.min(rect.width, vw - margin * 2);
        const left = Math.max(margin, Math.min(rect.left, vw - width - margin));

        portalWrap.style.width = `${Math.round(width)}px`;
        portalWrap.style.left = `${Math.round(left)}px`;
        portalWrap.style.right = "auto";
        portalWrap.style.bottom = "auto";

        const spaceBelow = vh - rect.bottom - margin - gap;
        const spaceAbove = rect.top - margin - gap;
        const estimatedHeight = Math.min(portalList.scrollHeight + 16, 300);

        if (spaceBelow < Math.min(estimatedHeight, 220) && spaceAbove > spaceBelow) {
          const maxH = Math.max(120, Math.min(290, spaceAbove - 14));
          portalList.style.maxHeight = `${Math.floor(maxH)}px`;
          const menuH = portalWrap.offsetHeight || Math.min(estimatedHeight, maxH + 14);
          portalWrap.style.top = `${Math.max(margin, Math.round(rect.top - menuH - gap))}px`;
        } else {
          const maxH = Math.max(120, Math.min(290, spaceBelow - 14));
          portalList.style.maxHeight = `${Math.floor(maxH)}px`;
          portalWrap.style.top = `${Math.round(rect.bottom + gap)}px`;
        }
      }

      function openPortal(select) {
        const entry = widgetMap.get(select);
        if (!entry) return;

        if (activeSelect && activeSelect !== select) {
          closePortal(false);
        }

        activeSelect = select;
        entry.root.classList.add("is-open");
        entry.trigger.setAttribute("aria-expanded", "true");

        portalTitle.textContent = getLabelForSelect(select);
        portalList.innerHTML = "";

        const selectedIdx = Math.max(0, select.selectedIndex);
        for (let i = 0; i < select.options.length; i++) {
          const opt = select.options[i];
          const li = document.createElement("li");
          li.className = "nb-portal-option" + (i === selectedIdx ? " is-selected" : "");
          li.setAttribute("role", "option");
          li.setAttribute("aria-selected", i === selectedIdx ? "true" : "false");
          li.dataset.index = String(i);

          const textSpan = document.createElement("span");
          textSpan.textContent = opt.textContent || "";

          const mark = document.createElement("span");
          mark.className = "nb-opt-mark";
          mark.setAttribute("aria-hidden", "true");

          li.appendChild(textSpan);
          li.appendChild(mark);

          li.addEventListener("mouseenter", function () {
            setActiveOption(i);
          });

          li.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            commitIndex(i);
          });

          portalList.appendChild(li);
        }

        const mobile = isMobileViewport();
        portalWrap.classList.toggle("is-mobile-sheet", mobile);
        portalWrap.setAttribute("aria-modal", mobile ? "true" : "false");
        portalWrap.classList.add("is-open");

        if (mobile) {
          portalWrap.style.top = "";
          portalWrap.style.left = "";
          portalWrap.style.width = "";
          portalList.style.maxHeight = "";
          backdrop.classList.add("is-visible");
          prevBodyOverflow = document.body.style.overflow;
          document.body.style.overflow = "hidden";
        } else {
          backdrop.classList.remove("is-visible");
          positionDesktopPortal(entry);
        }

        setActiveOption(selectedIdx);
      }

      function closePortal(restoreFocus) {
        if (!activeSelect) return;
        const prev = activeSelect;
        const entry = widgetMap.get(prev);
        activeSelect = null;
        activeIndex = -1;

        if (entry) {
          entry.root.classList.remove("is-open");
          entry.trigger.setAttribute("aria-expanded", "false");
        }

        portalWrap.classList.remove("is-open", "is-mobile-sheet");
        backdrop.classList.remove("is-visible");
        document.body.style.overflow = prevBodyOverflow;

        if (restoreFocus && entry && entry.trigger.isConnected) {
          entry.trigger.focus({ preventScroll: true });
        }
      }

      function cleanupOrphanedWidgets() {
        const liveSelects = new Set(baseForm.querySelectorAll(":scope > select"));
        if (activeSelect && !liveSelects.has(activeSelect)) {
          closePortal(false);
        }

        const widgets = baseForm.querySelectorAll(":scope > .nb-select");
        widgets.forEach(function (widget) {
          const prev = widget.previousElementSibling;
          if (!prev || prev.tagName !== "SELECT" || !liveSelects.has(prev)) {
            widget.remove();
          }
        });
      }

      let syncing = false;
      function syncAll() {
        if (syncing) return;
        syncing = true;
        try {
          cleanupOrphanedWidgets();
          const selects = baseForm.querySelectorAll(":scope > select");
          selects.forEach(function (sel) {
            buildSelectWidget(sel);
          });
        } finally {
          syncing = false;
        }
      }

      // Observe dynamic form updates made by the primary console script
      const observer = new MutationObserver(function () {
        syncAll();
      });
      observer.observe(baseForm, { childList: true });

      // Clicking a label linked to an enhanced select toggles its custom trigger
      baseForm.addEventListener("click", function (event) {
        const label = event.target instanceof Element ? event.target.closest("label[for]") : null;
        if (!label) return;
        const targetId = label.getAttribute("for");
        if (!targetId) return;
        const targetEl = document.getElementById(targetId);
        if (targetEl && targetEl.tagName === "SELECT" && widgetMap.has(targetEl)) {
          event.preventDefault();
          if (activeSelect === targetEl) {
            closePortal(false);
          } else {
            openPortal(targetEl);
          }
        }
      });

      // Keep trigger values aligned after radio switches that assign .value programmatically
      document.querySelectorAll('input[name="options"]').forEach(function (radio) {
        radio.addEventListener("change", function () {
          closePortal(false);
          syncAll();
          queueMicrotask(syncAll);
        });
      });

      portalClose.addEventListener("click", function (event) {
        event.preventDefault();
        closePortal(true);
      });

      backdrop.addEventListener("click", function () {
        closePortal(true);
      });

      document.addEventListener("click", function (event) {
        if (!activeSelect) return;
        const target = event.target;
        if (target instanceof Node && portalWrap.contains(target)) return;
        const entry = widgetMap.get(activeSelect);
        if (entry && target instanceof Node && entry.root.contains(target)) return;
        closePortal(false);
      });

      document.addEventListener("keydown", function (event) {
        if (!activeSelect) return;
        if (event.key === "Escape") {
          event.preventDefault();
          closePortal(true);
        } else if (event.key === "ArrowDown") {
          event.preventDefault();
          moveActive(1);
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          moveActive(-1);
        } else if (event.key === "Home") {
          event.preventDefault();
          setActiveOption(0);
        } else if (event.key === "End") {
          event.preventDefault();
          setActiveOption(activeSelect.options.length - 1);
        } else if (event.key === "Enter") {
          event.preventDefault();
          commitActive();
        } else if (event.key === "Tab") {
          closePortal(false);
        }
      });

      window.addEventListener("resize", function () {
        if (!activeSelect) return;
        const entry = widgetMap.get(activeSelect);
        if (!entry) return;
        const mobile = isMobileViewport();
        portalWrap.classList.toggle("is-mobile-sheet", mobile);
        if (mobile) {
          portalWrap.style.top = "";
          portalWrap.style.left = "";
          portalWrap.style.width = "";
          portalList.style.maxHeight = "";
          backdrop.classList.add("is-visible");
        } else {
          backdrop.classList.remove("is-visible");
          document.body.style.overflow = prevBodyOverflow;
          positionDesktopPortal(entry);
        }
      });

      window.addEventListener(
        "scroll",
        function (event) {
          if (!activeSelect || isMobileViewport()) return;
          if (event.target instanceof Node && portalWrap.contains(event.target)) return;
          const entry = widgetMap.get(activeSelect);
          if (entry) {
            positionDesktopPortal(entry);
          }
        },
        true
      );

      // Default to コンソール命令 (console_command) on initial page load
      const defaultConsoleRadio = document.getElementById("console");
      if (defaultConsoleRadio && !document.querySelector('input[name="options"]:checked')) {
        defaultConsoleRadio.checked = true;
        defaultConsoleRadio.dispatchEvent(new Event("change", { bubbles: true }));
      }
      syncAll();
    })();
  </script>
