<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>未認証 // DH-Web-Console</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Dela+Gothic+One&family=JetBrains+Mono:wght@700;800&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-display: "Chakra Petch", "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Kaku Gothic StdN", "Yu Gothic", "Meiryo", sans-serif;
        --font-ui: "Chakra Petch", "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        --font-tech: "Chakra Petch", "JetBrains Mono", "Zen Kaku Gothic New", "Cascadia Mono", "Consolas", monospace;
        --ink: #0b0b10;
        --paper: #f6f4ea;
        --blue: #1e6bff;
        --cyan: #00e5ff;
        --green: #00ff87;
        --yellow: #ffe600;
        --pink: #ff2a85;
        --red: #ff2a55;
        --neon-strip: linear-gradient(
          115deg,
          #00e5ff 0%,
          #1e6bff 22%,
          #00ff87 44%,
          #ffe600 66%,
          #ff2a55 84%,
          #ff00aa 100%
        );
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--font-ui);
        font-feature-settings: "palt" 1;
        background-color: var(--paper);
        background-image:
          linear-gradient(135deg, rgba(255, 42, 85, 0.08) 0, rgba(255, 42, 85, 0.08) 18%, transparent 18%),
          linear-gradient(-45deg, rgba(0, 229, 255, 0.1) 0, rgba(0, 229, 255, 0.1) 16%, transparent 16%),
          linear-gradient(to right, rgba(11, 11, 16, 0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(11, 11, 16, 0.06) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 26px 26px, 26px 26px;
        color: var(--ink);
        position: relative;
        overflow-x: hidden;
      }

      .geo-shard {
        position: fixed;
        pointer-events: none;
        z-index: 0;
      }

      .shard-a {
        top: 6%;
        left: 5%;
        width: 110px;
        height: 110px;
        background: var(--yellow);
        clip-path: polygon(0 0, 100% 18%, 22% 100%);
        filter: drop-shadow(6px 6px 0 var(--ink));
      }

      .shard-b {
        bottom: 8%;
        right: 6%;
        width: 130px;
        height: 82px;
        background: var(--pink);
        clip-path: polygon(16% 0, 100% 0, 84% 100%, 0 100%);
        filter: drop-shadow(6px 6px 0 var(--ink));
      }

      .shard-c {
        top: 14%;
        right: 10%;
        width: 58px;
        height: 58px;
        background: var(--cyan);
        clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
        filter: drop-shadow(4px 4px 0 var(--ink));
      }

      .frame {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 540px;
        filter: drop-shadow(9px 9px 0 var(--ink)) drop-shadow(5px 5px 0 var(--pink));
      }

      .frame-border {
        background: var(--ink);
        padding: 4px;
        clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 26px 100%, 0 calc(100% - 26px));
      }

      .container {
        background-color: #ffffff;
        clip-path: polygon(0 0, calc(100% - 23px) 0, 100% 23px, 100% 100%, 23px 100%, 0 calc(100% - 23px));
        text-align: center;
      }

      .hazard {
        height: 16px;
        background: repeating-linear-gradient(
          -55deg,
          var(--ink) 0,
          var(--ink) 12px,
          var(--yellow) 12px,
          var(--yellow) 24px
        );
        border-bottom: 4px solid var(--ink);
      }

      .content {
        padding: 36px 28px 40px;
      }

      .icon-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        margin-bottom: 16px;
        background: var(--ink);
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        filter: drop-shadow(4px 4px 0 var(--cyan));
      }

      .icon-badge img {
        width: 34px;
        height: 34px;
        image-rendering: auto;
      }

      .tag {
        display: inline-block;
        background-color: var(--yellow);
        color: var(--ink);
        padding: 5px 19px;
        font-family: var(--font-tech);
        font-style: italic;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        margin-bottom: 18px;
        clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        filter: drop-shadow(4px 4px 0 var(--ink));
      }

      h1 {
        margin: 0 0 14px;
        font-family: var(--font-display);
        font-size: 26px;
        font-weight: 900;
        font-synthesis-weight: none;
        color: var(--red);
        letter-spacing: 0.05em;
        line-height: 1.25;
        text-shadow: 2px 2px 0 var(--ink), 4px 4px 0 rgba(11, 11, 16, 0.25);
      }

      p {
        margin: 0;
        font-family: var(--font-ui);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.025em;
        line-height: 1.85;
        color: var(--ink);
      }

      .footer-strip {
        height: 8px;
        background: var(--neon-strip);
        border-top: 3px solid var(--ink);
      }

      @media (max-width: 520px) {
        .shard-a, .shard-b, .shard-c {
          opacity: 0.45;
          transform: scale(0.7);
        }
        .content {
          padding: 28px 18px 32px;
        }
        h1 {
          font-size: 22px;
        }
        p {
          font-size: 14px;
        }
      }
    </style>
</head>
<body>
    <div class="geo-shard shard-a" aria-hidden="true"></div>
    <div class="geo-shard shard-b" aria-hidden="true"></div>
    <div class="geo-shard shard-c" aria-hidden="true"></div>
    <div class="frame">
      <div class="frame-border">
        <div class="container">
          <div class="hazard"></div>
          <div class="content">
            <div class="icon-badge"><img src="/favicon.ico" alt=""></div>
            <div><span class="tag">ACCESS DENIED // 401</span></div>
            <h1>未認証なユーザーです</h1>
            <p>あなたはこのウェブサイトへアクセスする権限がありません。<br>サーバーツールに表示された認証URLからアクセスしてください。</p>
          </div>
          <div class="footer-strip"></div>
        </div>
      </div>
    </div>
</body>
</html>
