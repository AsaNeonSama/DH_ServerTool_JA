[package]
name = "dh-gadget-injector"
version = "0.1.0"
edition = "2021"
license-file.workspace = true
repository.workspace = true
description = "Reusable Frida Gadget 17.27.4 OEP early-injection runtime with NTFS hard-link caching, Frida 16->17 shim, and loopback NDJSON log/handshake channel"

[dependencies]
dh-win32 = { path = "../dh-win32" }
iced-x86 = { version = "1.21", default-features = false, features = ["code_asm", "std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
] }
zstd = { version = "0.14", default-features = false }

[build-dependencies]
lzma-rs = "0.3"
sha2 = "0.11"
zstd = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
