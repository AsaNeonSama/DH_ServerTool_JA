[package]
name = "dh-server-launcher"
version = "2.1.0"
edition = "2021"
license-file.workspace = true
repository.workspace = true
description = "Dread Hunger Dedicated Server Launcher & In-App Admin Console"
authors = ["アサネオン / Build With Antigravity"]
build = "build.rs"

[lib]
name = "dh_server_launcher"
path = "src/lib.rs"

[[bin]]
name = "DH_ServerLauncher_JA"
path = "src/main.rs"

[dependencies]
dh-win32 = { path = "../dh-win32" }
dh-gadget-injector = { path = "../dh-gadget-injector" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-util = "0.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
