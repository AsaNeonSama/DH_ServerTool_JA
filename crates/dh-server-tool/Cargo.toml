[package]
name = "dh-server-tool"
version = "2.1.0"
edition = "2021"
license-file.workspace = true
repository.workspace = true
description = "Dread Hunger Dedicated Server Controller & Web Console"
authors = ["アサネオン / Build With Antigravity"]
build = "build.rs"

[lib]
name = "dh_server_tool"
path = "src/lib.rs"

[[bin]]
name = "DH_ServerTool_JA"
path = "src/main.rs"

[dependencies]
dh-win32 = { path = "../dh-win32" }
dh-gadget-injector = { path = "../dh-gadget-injector" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.23"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zstd = { version = "0.13", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
flate2 = "1"
brotli = "9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
